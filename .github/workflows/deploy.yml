name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC permissions required by the Pages deployment API
permissions:
  contents: read
  pages: write
  id-token: write

# never queue overlapping deployments; let in-flight ones finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # static site served from the repository root: no build step
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
